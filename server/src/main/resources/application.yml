server:
  port: 8080

spring:
  application:
    name: kangcode-movie-ticket
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 图片上传：单文件 5MB、单次请求 10MB。
  # 这个限制和 aliyun.oss.max-size 是两道闸：Tomcat 在进入 Controller 前先拦一次，
  # 业务层再按配置校验一次，避免只改一处导致两边口径不一致。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:movie}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3s
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 8
  rabbitmq:
    host: ${RABBITMQ_HOST:43.166.0.94}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
        # RabbitMQ 连接/认证失败时不阻断启动，后台自动重试
        possible-authentication-failure-fatal: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kangcode.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: kangcode-movie-ticket-secret-2026
  expire-minutes: 720

# ============================================================
# 阿里云对象存储 OSS：影院 Logo、电影海报、用户头像都存这里
# 密钥一律通过环境变量注入（OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET），
# 这里的空默认值意味着「没配就不启用上传」，应用仍可正常启动。
# 本地开发的实际值放在 application-dev.yml（该文件不入库），
# 线上请用环境变量或 KMS/密钥管理服务，切勿把 AK/SK 提交进仓库。
# ============================================================
aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
    endpoint: ${OSS_ENDPOINT:}
    # 自定义域名/CDN 加速域名，留空则用 https://{bucket}.{endpoint}
    domain: ${OSS_DOMAIN:}
    dir-prefix: movie-ticket
    max-size: 5242880          # 5MB
    allow-extensions: jpg,jpeg,png,webp,gif

logging:
  level:
    com.kangcode: debug

management:
  endpoints:
    web:
      exposure:
        include: health,metrics      # 只暴露这两个，千万别写 *（env/beans/heapdump 会泄露配置甚至堆内存）
  endpoint:
    health:
      show-details: always           # 展开每个组件（db/redis/rabbit）的状态
