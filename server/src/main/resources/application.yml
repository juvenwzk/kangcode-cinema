server:
  port: 8080

spring:
  application:
    name: kangcode-railway-ticket
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:railway}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3s
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 8
  rabbitmq:
    host: ${RABBITMQ_HOST:43.166.0.94}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
        # RabbitMQ 连接/认证失败时不阻断启动，后台自动重试
        possible-authentication-failure-fatal: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kangcode.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  secret: kangcode-railway-ticket-secret-2026
  expire-minutes: 720

logging:
  level:
    com.kangcode: debug

management:
  endpoints:
    web:
      exposure:
        include: health,metrics      # 只暴露这两个，千万别写 *（env/beans/heapdump 会泄露配置甚至堆内存）
  endpoint:
    health:
      show-details: always           # 展开每个组件（db/redis/rabbit）的状态
