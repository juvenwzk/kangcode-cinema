spring:
  # application-local.yml 被 .gitignore 忽略（规则 *-local.yml），用来放本机密钥：
  # OSS 的 AK/SK、以及各人不同的数据库密码。optional: 表示文件不存在也能正常启动，
  # 团队其他人和 CI 拉下代码后直接跑 dev 不会因为缺文件报错。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/movie?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    # 该 Redis 未启用密码认证（若哪天加了密码，在这里填上）
    password:
  rabbitmq:
    # RabbitMQ 与 youmall 使用同一套远程服务
    host: 43.166.0.94
    port: 5672
    username: admin
    password: "123456"

rabbitmq:
  consumer:
    enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
